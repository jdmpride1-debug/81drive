name: Performance audit (US)

# Measures https://81drive.com/ from a GitHub-hosted runner (US region),
# so the numbers approximate what a visitor in the United States experiences.
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit
        required: false
        default: https://81drive.com/
  push:
    branches:
      - 'claude/**'
  schedule:
    # Weekly regression check, Mondays 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report runner location
        run: |
          echo "Runner public IP / geo (confirms the US vantage point):"
          curl -s --max-time 15 https://ipinfo.io/json || echo "(geo lookup unavailable)"

      - name: Install Lighthouse
        run: npm install -g lighthouse@12

      - name: Network timing breakdown
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://81drive.com/' }}
        run: bash scripts/curl-timing.sh "$TARGET_URL"

      - name: Lighthouse - mobile
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://81drive.com/' }}
        run: |
          for i in 1 2 3; do
            lighthouse "$TARGET_URL" \
              --only-categories=performance \
              --output=json --output=html \
              --output-path="./lh-mobile-$i" \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
              --quiet || true
          done

      - name: Lighthouse - desktop
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://81drive.com/' }}
        run: |
          for i in 1 2 3; do
            lighthouse "$TARGET_URL" \
              --preset=desktop \
              --only-categories=performance \
              --output=json --output=html \
              --output-path="./lh-desktop-$i" \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
              --quiet || true
          done

      - name: Summarize results
        run: node scripts/summarize-lighthouse.js

      - name: Cache headers after the audit
        if: always()
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://81drive.com/' }}
        run: |
          # Repeated at the end so the cache state always lands in the log tail,
          # next to the numbers it explains. Two hits: the second shows whether
          # the first one populated the edge.
          for i in 1 2; do
            echo "--- request $i ---"
            curl -sSI --max-time 30 "$TARGET_URL" 2>/dev/null \
              | grep -iE '^(cf-cache-status|cf-ray|age|x-nginx-cache|cache-control|last-modified|vary)' \
              | sed 's/^/  /'
          done
          echo "--- preload / fetchpriority in the delivered HTML ---"
          # The digest inspects the LCP <img> element, which cannot see a
          # <link rel=preload> in <head>. Check the head markup directly.
          HTML=$(curl -sS --max-time 30 "$TARGET_URL" 2>/dev/null)
          if grep -qi 'rel=["'"'"']\?preload' <<<"$HTML"; then
            echo "  rel=preload present:"
            grep -oiE '<link[^>]*rel=["'"'"']?preload[^>]*>' <<<"$HTML" | cut -c1-200 | sed 's/^/    /'
          else
            echo "  rel=preload : NOT FOUND"
          fi
          if grep -qi 'fetchpriority' <<<"$HTML"; then
            echo "  fetchpriority present:"
            grep -oiE '[^ >]*fetchpriority=["'"'"']?[a-z]*' <<<"$HTML" | sort -u | sed 's/^/    /'
          else
            echo "  fetchpriority: NOT FOUND anywhere in the HTML"
          fi

          echo "--- is the LCP image itself cached at the edge? ---"
          # Every run's first Lighthouse pass is the slow one. If the image is a
          # MISS on first fetch and a HIT afterwards, that outlier is the edge
          # fetching it from the origin, not the page being slow.
          IMG="https://81drive.com/wp-content/uploads/2026/09/Hopping-Daikoku-PA%E2%91%A0.jpg"
          for i in 1 2 3; do
            printf '  fetch %d: ' "$i"
            curl -sSI --max-time 30 "$IMG" 2>/dev/null \
              | grep -iE '^(cf-cache-status|age|cf-ray|content-length)' \
              | tr -d '\r' | paste -sd' ' -
          done

          echo "--- which banner does the HTML reference? ---"
          curl -sS --max-time 30 "$TARGET_URL" 2>/dev/null \
            | grep -oE '/wp-content/uploads/[0-9]{4}/[0-9]{2}/[^"?]+\.(png|jpe?g|webp)' \
            | sed 's/%E3%83%90%E3%83%8A%E3%83%BC/BANNER/g' \
            | sort -u | head -20 | sed 's/^/  /'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lh-*.report.html
            lh-*.report.json
            perf-summary.md
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: cat perf-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Last step on purpose: the digest is what gets read back, and a short
      # log tail is enough to reach it.
      - name: Key numbers
        if: always()
        run: cat perf-brief.txt 2>/dev/null || echo "(no digest produced)" 
